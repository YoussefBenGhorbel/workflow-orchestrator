version: "3.9"

services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://user:pass@db:5432/dbname
      OPENAI_API_KEY: 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



  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
  frontend:
    build:
      context: ../frontend/frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "5173:5173"
    depends_on:
      - api